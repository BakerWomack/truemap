[package]
name = "truemap"
version = "0.1.0"
edition = "2021"
description = "Fast TCP port scanner that adjudicates which 'open' ports are real services and whether the host is actually alive"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"
ipnet = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
